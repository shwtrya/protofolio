    <!-- Module error handler -->
    <script>
      (function() {
        let moduleErrorCount = 0;
        const MAX_RETRIES = 2;

        window.addEventListener('error', function(e) {
          if (e.message && (
            e.message.includes('Failed to fetch') ||
            e.message.includes('Importing a module') ||
            e.message.includes('dynamically imported module')
          )) {
            moduleErrorCount++;
            console.warn('Module loading error detected:', e.message);

            if (moduleErrorCount <= MAX_RETRIES) {
              console.log('Attempting to reload... (attempt ' + moduleErrorCount + ')');

              if ('caches' in window) {
                caches.keys().then(function(names) {
                  return Promise.all(
                    names.map(function(name) {
                      return caches.delete(name);
                    })
                  );
                }).then(function() {
                  window.location.reload();
                });
              } else {
                setTimeout(function() {
                  window.location.reload();
                }, 500);
              }

              e.preventDefault();
            }
          }
        }, true);
      })();
    </script>
